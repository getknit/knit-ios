# SwiftLint runs with --strict, so a warning fails the build exactly like an error. Every opt-in rule is on.
# A rule leaves only for one of three reasons, written beside it: it contradicts another rule we keep, it
# fights swift-format (which owns layout), or it breaks a wire invariant.

included:
  - Package.swift
  - Sources
  - Tests
  - Fuzz/Package.swift
  - Fuzz/Sources
excluded:
  - .build
  - Fuzz/.build

opt_in_rules:
  - all

disabled_rules:
  # Contradictory pairs: we keep the other half.
  - explicit_acl                    # explicit_top_level_acl covers the API surface; members stay implicit
  - explicit_type_interface         # contradicts redundant_type_annotation
  - extension_access_modifier       # contradicts no_extension_access_modifier and swift-format's rule
  - explicit_self                   # contradicts redundant_self
  - pattern_matching_keywords       # contradicts swift-format's UseLetInEveryBoundCaseVariable
  # swift-format owns layout; these rules disagree with its output.
  - attributes
  - contrasted_opening_brace        # Allman braces; swift-format writes K&R, and opening_brace agrees
  - closure_end_indentation
  - conditional_returns_on_newline
  - indentation_width
  - let_var_whitespace              # swift-format owns vertical spacing
  - vertical_whitespace_between_cases  # swift-format owns vertical spacing
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - sorted_imports                  # swift-format's OrderedImports groups @testable and conditional imports
  - trailing_comma
  - vertical_parameter_alignment_on_call
  # Wire invariants.
  - discouraged_optional_collection # nil and [] encode differently on the wire (`acks`, `departed`)
  - function_default_parameter_at_end  # wire initializers follow the Kotlin declaration order
  - sorted_enum_cases               # wire enums keep the declaration order knit-next encodes
  # Organisation rules that fight how the code reads.
  - file_header                     # no per-file headers, as in knit-next; the license is repo-wide
  - file_types_order
  - no_grouping_extension           # conformances live in their own extensions
  - one_declaration_per_file
  - prefixed_toplevel_constant
  - required_deinit
  - type_contents_order

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

nesting:
  type_level: 2

line_length:
  warning: 140
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded:
    - i
    - j
    - n

type_name:
  min_length: 3

number_separator:
  minimum_length: 5

cyclomatic_complexity:
  ignores_case_statements: true

missing_docs:
  warning: [open, public]
  excludes_extensions: true
  excludes_inherited_types: true

file_name:
  excluded:
    - main.swift
    - Package.swift

# One importer per framework, as in knit-next's rules/mesh.md; each rule is the machine check for a seam in
# .agents/context/architecture.md.
custom_rules:
  seam_corebluetooth:
    name: CoreBluetooth stays in KnitBLE
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+CoreBluetooth\b'
    excluded: 'Sources/KnitBLE/'
    message: Only KnitBLE imports CoreBluetooth; everything above the radio talks to MeshTransport.
    severity: error
  seam_ui_frameworks:
    name: SwiftUI and UIKit stay in the app target
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+(SwiftUI|UIKit)\b'
    excluded: 'Sources/Knit/'
    message: Only the Knit app target imports SwiftUI or UIKit; view models live in KnitAppCore.
    severity: error
  seam_security:
    name: Security stays in the app target
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+Security\b'
    excluded: 'Sources/Knit/'
    message: Only the app's Keychain store imports Security.
    severity: error
  seam_network:
    name: Network stays in the debug bridge
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+Network\b'
    excluded: 'Sources/Knit/Debug/'
    message: Only the app's debug bridge imports Network; Knit meshes over Bluetooth alone (ADR 2026-09.zwdp).
    severity: error
  seam_codes:
    name: The camera and QR frameworks stay in the app's Codes
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+(AVFoundation|Vision|VisionKit|CoreImage)\b'
    excluded: 'Sources/Knit/Codes/'
    message: Only the app's Codes directory draws and scans verify codes (ADR 2026-10.65xx); the scan's logic lives in KnitAppCore.
    severity: error
  seam_images:
    name: The photo frameworks stay in the app's Images
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+(PhotosUI|Photos|ImageIO|UniformTypeIdentifiers|CoreTransferable)\b'
    # The two ImageIOTests check, on the Mac, that ImageIO reads what libwebp writes and writes what JPEGStrip reads.
    excluded:
      - 'Sources/Knit/Images/'
      - 'Tests/(KnitAppCoreTests|KnitWebPTests)/ImageIOTests\.swift'
    message: Only the app's Images directory picks, decodes, encodes and saves photos; what a face or thread shows is KnitAppCore's.
    severity: error
  seam_storekit:
    name: StoreKit stays in the app's Platform
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+StoreKit\b'
    excluded: 'Sources/Knit/Platform/'
    message: Only the app's Platform directory reads the storefront (ADR 2026-10.zv5c); which links show is KnitAppCore's.
    severity: error
  seam_webp:
    name: libwebp stays in KnitWebP
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+libwebp\b'
    excluded:
      - 'Sources/KnitWebP/'
      - 'Tests/KnitWebPTests/'
    message: Only KnitWebP calls libwebp (ADR 2026-10.m4ah); the app writes WebP through its Swift API.
    severity: error
  seam_coreml:
    name: Core ML stays in the app's Moderation
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+CoreML\b'
    excluded: 'Sources/Knit/Moderation/'
    message: Only the app's Moderation directory runs the content filter's model (ADR 2026-10.rpmq); the policy is KnitAppCore's.
    severity: error
  seam_grdb:
    name: GRDB stays in KnitStoreSQL
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+GRDB\b'
    excluded: 'Sources/KnitStoreSQL/|Tests/KnitStoreSQLTests/'
    message: Only KnitStoreSQL and its tests import GRDB; everything else talks to the KnitStore protocols.
    severity: error
  seam_cdbus:
    name: libdbus stays in KnitBlueZ
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+(CDBus|CBluetoothShim)\b'
    excluded: 'Sources/KnitBlueZ/|Tests/KnitBlueZTests/'
    message: Only KnitBlueZ, and the tests that host its fake BlueZ, import libdbus and the Bluetooth socket shim.
    severity: error
  no_cryptokit:
    name: Import Crypto, not CryptoKit
    regex: '^\s*(@\w+\s+)*(\w+\s+)?import\s+CryptoKit\b'
    message: Import swift-crypto's Crypto, which is CryptoKit on Apple platforms and also builds on Linux.
    severity: error
  no_mutex:
    name: Lock, not Mutex
    regex: '\bMutex\b'
    excluded: 'Sources/KnitSync/'
    match_kinds: [identifier, typeidentifier]
    message: Use KnitSync's Lock. TSan on Linux cannot see Mutex's futex and reports races it rules out (ADR 2026-09.ahrr).
    severity: error
  no_print:
    name: No print in shipped code
    regex: '(?<![\w.])print\('
    included: 'Sources/'
    match_kinds: [identifier]
    message: Log through KnitLog; knit-peer writes its JSON lines to FileHandle.standardOutput.
    severity: error
  mesh_injected_clock:
    name: The mesh reads time through its injected clocks
    regex: '(\bDate\(\)|\bDate\.now\b|\bTask\.sleep\b|\bContinuousClock\(\))'
    included: 'Sources/(KnitWire|KnitCrypto|KnitStore|KnitStoreSQL|KnitMesh)/'
    # SystemClock is the one real clock behind MeshClock, which the app and knit-peer inject.
    excluded: 'Sources/KnitMesh/Engine/SystemClock\.swift'
    message: Take the wall clock and the monotonic clock as dependencies, so the lab can drive them.
    severity: error
  mesh_injected_randomness:
    name: The mesh draws randomness through its injected generator
    regex: '(\bUUID\(\)|\bSystemRandomNumberGenerator\(\)|\.random\()'
    included: 'Sources/(KnitWire|KnitStore|KnitStoreSQL|KnitMesh)/'
    message: Take a RandomNumberGenerator as a dependency, so chaos runs are reproducible from a seed.
    severity: error
  wire_no_codable:
    name: CBOR types are encoded by hand
    regex: ':\s*[^{\n]*\b(Codable|Encodable|Decodable)\b'
    included: 'Sources/KnitWire/'
    excluded: 'Sources/KnitWire/.*JSON\.swift'
    message: Signed bytes are never round-tripped through Codable; JSON link records live in *JSON.swift.
    severity: error
