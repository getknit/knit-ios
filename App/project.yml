# XcodeGen spec for the Xcode build on the Mac (ADR 2026-09.de8f). `scripts/check.sh xcode` generates
# App/Knit.xcodeproj from it; the project is never committed. The app target is only a host: every line of
# Swift, @main included, comes from the root package's `Knit` product.
name: Knit
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Knit.xcconfig
  Release: Knit.xcconfig
packages:
  Knit:
    path: ..
targets:
  # Not `Knit`, which is the package's module. PRODUCT_NAME still makes it Knit.app/Knit.
  KnitApp:
    type: application
    platform: iOS
    sources:
      - Host
      - Assets.xcassets
      # The privacy manifest: UserDefaults, and nothing collected or tracked. GRDB and swift-crypto bring their own,
      # in their resource bundles. `check.sh release` checks every manifest reaches the app.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Info.plist
        buildPhase: none
      # The content filter's photo model (ADR 2026-10.rpmq): Xcode compiles it into Knit.app/NSFW.mlmodelc, which
      # DevicePhotoClassifier loads. One package, not the folder of files it is; `check.sh xcode` checks it lands.
      - path: Models/NSFW.mlpackage
        type: file
        buildPhase: sources
      # Its text model (ADR 2026-10.e4kz), compiled into Knit.app/Toxicity.mlmodelc for DeviceTextClassifier, with
      # Android's tokenizer beside it and the Nearby room's word list, both copied as they are.
      - path: Models/Toxicity.mlpackage
        type: file
        buildPhase: sources
      - path: Models/ToxicityTokenizer.json
        buildPhase: resources
      - path: Models/Profanity.txt
        buildPhase: resources
      - path: Models/Slurs.txt
        buildPhase: resources
      # The demo's faces and photos (ADR 2026-10.2acj), copied whole as Knit.app/DemoMedia for DemoPictures. Debug only:
      # Release's EXCLUDED_SOURCE_FILE_NAMES leaves it out, and `check.sh release` fails if it lands.
      - path: DemoMedia
        type: folder
        buildPhase: resources
    dependencies:
      - package: Knit
        product: Knit
    settings:
      base:
        PRODUCT_NAME: Knit
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Info.plist
        # Adds the bundle id and executable keys to App/Info.plist's own.
        GENERATE_INFOPLIST_FILE: true
        # The generated plist takes its version keys from these two, over App/Info.plist's. Keep them equal to
        # its CFBundleShortVersionString and CFBundleVersion; `check.sh xcode` fails when they differ.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "3"
        # iPhone only (ADR 2026-10.kedu). An iPad runs it in iPhone compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Package.swift already links Knit with -ObjC for KnitBLE's delegates; this keeps it if that moves.
        OTHER_LDFLAGS: [-ObjC]
        # The model's generated class would land in this C host, out of the package's reach; DevicePhotoClassifier
        # loads the compiled model by name instead.
        COREML_CODEGEN_LANGUAGE: None
      configs:
        # ADR 2026-09.txqp: Xcode-signed development builds take the .dev id.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.getknit.knit.dev
          # The bridge's screen recordings take the microphone (ADR 2026-10.x2cq), and iOS ends an app that asks for it
          # without this key. Debug only: a store build never records, and `check.sh release` checks the key is absent.
          INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
            This debug build of Knit records sound with the screen when a test script asks, so a demo film can line
            up its audio.
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.getknit.knit
          # The demo's pictures are licensed for the demo, and nothing in a store build reads them (ADR 2026-10.2acj).
          EXCLUDED_SOURCE_FILE_NAMES: DemoMedia
  # The Simulator's UI tests and accessibility audit (`scripts/check.sh uitest`). The sources live under Tests/ so
  # both linters see them, and AccessibilityID.swift comes straight from KnitAppCore, so the ids have one source.
  KnitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../Tests/KnitUITests
      - path: ../Sources/KnitAppCore/AccessibilityID.swift
    dependencies:
      - target: KnitApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.getknit.knit.uitests
        TARGETED_DEVICE_FAMILY: "1"
        # No App Intents here: the step that extracts their metadata only warns that it found none.
        LM_SKIP_METADATA_EXTRACTION: true
  # The iPhone's device tests (`scripts/check.sh devicetest`): Knit launched live, on the real radio and permission,
  # with the Settings app and SpringBoard driven beside it. Only the KnitDevice scheme runs them, never the Simulator.
  KnitDeviceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../Tests/KnitDeviceTests
      - path: ../Tests/KnitUITests/Walking.swift
      - path: ../Sources/KnitAppCore/AccessibilityID.swift
    dependencies:
      - target: KnitApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.getknit.knit.devicetests
        TARGETED_DEVICE_FAMILY: "1"
        LM_SKIP_METADATA_EXTRACTION: true
        # Its runner, app.getknit.knit.devicetests.xctrunner, installs on the phone, so it signs as the app does and
        # -allowProvisioningUpdates makes its profile.
        CODE_SIGN_STYLE: Automatic
  # The store's screenshots (`scripts/check.sh shots`, ADR 2026-10.5u39): the screens the listing shows, on the marketing
  # scene, in light and dark. Only the KnitShots scheme runs it, in a Simulator of its own.
  KnitShots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../Tests/KnitShots
      - path: ../Tests/KnitUITests/Walking.swift
      - path: ../Sources/KnitAppCore/AccessibilityID.swift
    dependencies:
      - target: KnitApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.getknit.knit.shots
        TARGETED_DEVICE_FAMILY: "1"
        LM_SKIP_METADATA_EXTRACTION: true
schemes:
  Knit:
    build:
      targets:
        KnitApp: all
        KnitUITests: [test]
    test:
      config: Debug
      targets:
        - KnitUITests
    run:
      config: Debug
      # The launch arguments in .agents/context/commands.md, all off. Tick the ones a run needs.
      commandLineArguments:
        "-seedDemo": false
        "-demoOnboarding": false
        "-demoScene marketing": false
        "-demoScene edge-cases": false
        "-demoRadio on": false
        "-demoRadio off": false
        "-demoRadio unauthorized": false
        "-demoRadio unsupported": false
        "-demoCamera denied": false
        "-demoCamera allowed": false
        "-demoSensitive": false
    archive:
      config: Release
  KnitDevice:
    build:
      targets:
        KnitApp: all
        KnitDeviceTests: [test]
    test:
      config: Debug
      targets:
        - KnitDeviceTests
  KnitShots:
    build:
      targets:
        KnitApp: all
        KnitShots: [test]
    test:
      config: Debug
      targets:
        - KnitShots
