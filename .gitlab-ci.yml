# knit-ios pipeline. Every Swift job runs a `scripts/check.sh` gate, so `scripts/check.sh all` on a laptop
# predicts this pipeline. Each gate is blocking from the commit that first gives it something to check
# (ADR router: .agents/memory/decisions.md). The advisory jobs say why beside `allow_failure`.
#
# Three kinds of runner:
#   - shared Linux runners for the light jobs, amd64 Docker runners and the Mac's arm64 Docker runner, so an untagged
#     job runs on either architecture;
#   - `knit-local`, a shell runner on a Linux workstation, for the heavy jobs (sanitizers, fuzzing, analyze) and for
#     `verify:periphery:linux`, since Periphery is built from source there;
#   - `macos`, the Mac's shell runner, for the Apple jobs: `build:ios:xcode` (ADR 2026-09.de8f), the signed
#     `build:ios:signed` (ADR 2026-09.zawh), `build:ios:release` and the manual `release:testflight` (ADR 2026-10.8cy5),
#     `test:macos`, `test:ios:simulator` (ADR 2026-09.jcdx) and `verify:periphery`. Every iPhone build happens there.
# The maintainer's private notes have the runner setup; `.agents/context/toolchain.md` has what a contributor needs.
# The signing jobs take the team from the project's KNIT_DEVELOPMENT_TEAM CI/CD variable, never from this file
# (ADR 2026-10.ab6k).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - build
  - test
  - verify
  - release

variables:
  SWIFT_IMAGE: "swift:6.4-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9"
  SWIFTLINT_VERSION: "0.65.1"
  # One SHA-256 per architecture: the Mac's Docker runner is arm64, the others amd64.
  SWIFTLINT_SHA256_AMD64: "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d"
  SWIFTLINT_SHA256_ARM64: "9ffa52f478e6d8eb485d37d14715ffac90abc81c58f3370d598bf75be05605f8"

.swift:
  image: $SWIFT_IMAGE
  variables:
    # SwiftPM's shared clone cache, which check.sh passes to every build and test whatever its scratch path.
    KNIT_SWIFTPM_CACHE: $CI_PROJECT_DIR/.build-swiftpm-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libdbus-1-dev libsqlite3-dev pkg-config python3 unzip curl ca-certificates >/dev/null
  # Keyed on the pins rather than the branch, so a new branch or MR starts warm. Each runner keeps its own cache, and
  # only build:linux writes it: the jobs after it would upload the same 250 MB again.
  cache:
    key:
      prefix: swiftpm
      files:
        - Package.resolved
    paths:
      - .build-swiftpm-cache/
    policy: pull

.swiftlint:
  extends: .swift
  before_script:
    - !reference [.swift, before_script]
    - |
      case "$(uname -m)" in
      x86_64) arch=amd64 sum=$SWIFTLINT_SHA256_AMD64 ;;
      aarch64) arch=arm64 sum=$SWIFTLINT_SHA256_ARM64 ;;
      *) echo "no SwiftLint build for $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_$arch.zip"
      echo "$sum  /tmp/swiftlint.zip" | sha256sum -c -
    - unzip -q -o -d /usr/local/bin /tmp/swiftlint.zip swiftlint

.local:
  # A shell job on a workstation has no container limits. The runner takes one job at a time
  # (`concurrent = 1`), and check.sh and fuzz.sh cap their own parallelism and priority.
  tags:
    - knit-local
  variables:
    # Keep the sanitizer and fuzzing trees between jobs, so a pipeline rebuilds only what changed, as the Mac keeps
    # .build-xcode. SwiftPM's clone cache is the runner account's own, in ~/.cache. Not .build: Periphery reads its
    # index, which keeps the records of deleted files (.agents/context/toolchain.md). analyze clears its own tree.
    GIT_CLEAN_FLAGS: -ffdx -e /.build-tsan/ -e /.build-asan/ -e /.build-fuzz/

.mac:
  # The Mac's shell runner, one job at a time and shared with every project's `macos` jobs. Its jobs run as
  # the maintainer's account with Xcode, XcodeGen and xcbeautify on the PATH (.agents/context/toolchain.md).
  tags:
    - macos

lint:lintorama:
  stage: lint
  image:
    name: zaventh/lintorama:7
    entrypoint: [""]
  script:
    - lint-extras

lint:adr-index:
  stage: lint
  image: python:3.13-alpine
  script:
    - python3 scripts/adr.py index --check

lint:dco:
  stage: lint
  image: alpine/git:2.47.2
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash >/dev/null
  script:
    - bash scripts/dco-check.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"

lint:swift:
  extends: .swiftlint
  stage: lint
  # swift-format and SwiftLint read only the sources, never the packages.
  cache: []
  script:
    - scripts/check.sh format lint

build:linux:
  extends: .swift
  stage: build
  cache:
    policy: pull-push
  script:
    - scripts/check.sh build

build:ios:xcode:
  extends: .mac
  stage: build
  variables:
    # Keep DerivedData between jobs, so a pipeline rebuilds only what changed.
    GIT_CLEAN_FLAGS: -ffdx -e /.build-xcode/
  script:
    - scripts/check.sh xcode
  artifacts:
    paths:
      - .build-xcode/Build/Products/Debug-iphoneos/Knit.app/
    expire_in: 1 week

build:ios:signed:
  # Signs with the maintainer's team in the Mac's desktop session. It renews the profile only when CI variables name
  # an App Store Connect API key (KNIT_ASC_KEY_ID, KNIT_ASC_ISSUER_ID); otherwise it uses the one the Mac has cached.
  # Only this project's pipelines sign: the runner takes every project's `macos` jobs, and a fork's would get the key.
  extends: .mac
  stage: build
  needs: [build:ios:xcode]
  rules:
    - if: $CI_PROJECT_PATH == "knit/knit-ios"
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e /.build-xcode/
  script:
    - scripts/check.sh device
  artifacts:
    paths:
      - .build-xcode/Build/Products/Debug-iphoneos/Knit.app/
    expire_in: 1 week

build:ios:release:
  # The Release build, unsigned, held to what a store build must hold: no debug code, the privacy manifests, the export
  # answer and the iPhone alone (ADR 2026-10.8cy5).
  extends: .mac
  stage: build
  needs: []
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e /.build-xcode/
  script:
    - scripts/check.sh release

test:linux:
  extends: .swift
  stage: test
  needs: [build:linux]
  script:
    - scripts/check.sh test
  artifacts:
    when: always
    reports:
      junit: .build/xunit-swift-testing.xml

test:macos:
  # The whole suite on macOS, KnitBLETests included: KnitBLE compiles to an empty module on Linux.
  extends: .mac
  stage: test
  needs: []
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e /.build/
  script:
    - scripts/check.sh test
  artifacts:
    when: always
    reports:
      junit: .build/xunit-swift-testing.xml

test:ios:simulator:
  # The UI tests and the accessibility audit on every MVP screen, at the default and the largest text size
  # (ADR 2026-09.jcdx). The result bundle keeps the largest-size screenshots and each failing element's.
  extends: .mac
  stage: test
  needs: []
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e /.build-xcode/
  script:
    - scripts/check.sh uitest
  artifacts:
    when: always
    paths:
      - .build-xcode/uitest.xcresult/
    expire_in: 1 week

test:coverage:
  extends: .swift
  stage: test
  needs: [build:linux]
  script:
    - scripts/check.sh coverage
  # The total that scripts/coverage-gate.py prints, for the MR widget and the project's coverage badge.
  coverage: '/total line coverage \d+\.\d+%/'

test:tsan:
  extends: .local
  stage: test
  needs: [build:linux]
  script:
    - scripts/check.sh tsan

test:asan:
  extends: .local
  stage: test
  needs: [build:linux]
  script:
    - scripts/check.sh asan

verify:analyze:
  # SourceKit holds every analyzed file's compiler instance until the run ends, and on Linux that outgrows
  # the shared runners' 8 GB per-job cap (OOM-killed at 8.35 GB). knit-local has no cap and SwiftLint 0.65.1.
  extends: .local
  stage: verify
  needs: [build:linux]
  script:
    - scripts/check.sh analyze

verify:fuzz:
  extends: .local
  stage: verify
  needs: [build:linux]
  script:
    - scripts/fuzz.sh 60
  artifacts:
    when: on_failure
    paths:
      - Fuzz/Crashes/
    expire_in: 4 weeks

verify:periphery:
  # Unused code, over the host build's index and the iPhone build's, which `check.sh xcode` leaves in .build-xcode
  # (ADR 2026-09.xgtz). KnitBlueZ is left to verify:periphery:linux, since its callers compile only there.
  extends: .mac
  stage: verify
  needs: []
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e /.build/ -e /.build-xcode/
  script:
    - scripts/check.sh xcode periphery

verify:periphery:linux:
  # The same scan on Linux, where KnitBlueZ, knit-peer's BlueZ host and their tests compile.
  extends: .local
  stage: verify
  needs: []
  script:
    - scripts/check.sh periphery

verify:trivy:
  stage: verify
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret,misconfig,license --exit-code 0 --format table .
  # Informational, as in knit-next: a finding opens an issue rather than blocking a merge.
  allow_failure: true

release:testflight:
  # Archives the app, signs it for the App Store and uploads it to App Store Connect for TestFlight (ADR 2026-10.8cy5).
  # Run by hand, from main or a tag of this project, once every other stage has passed; raise CURRENT_PROJECT_VERSION
  # in the commit first. The API key comes from the CI variables KNIT_ASC_KEY_ID and KNIT_ASC_ISSUER_ID, and its .p8
  # from the Mac. allow_failure keeps a pipeline whose upload nobody started from waiting on it: a manual job in
  # `rules` otherwise blocks the pipeline until someone runs it.
  extends: .mac
  stage: release
  rules:
    - if: $CI_PROJECT_PATH == "knit/knit-ios" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      when: manual
      allow_failure: true
  resource_group: app-store-connect
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e /.build-xcode/
  script:
    - scripts/check.sh upload
