# Zephyr's hci_usb sample: the controller only, behind USB's Bluetooth class, which btusb drives.
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK_NEXT=y
# The dongle's board brings USB up at boot for a console; this app brings it up for HCI instead.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USBD_BT_HCI=y
CONFIG_SAMPLE_USBD_PID=0x000B
CONFIG_SAMPLE_USBD_PRODUCT="Knit nRF52840 HCI"
# A serial number per chip, so lsusb tells the two dongles apart.
CONFIG_HWINFO=y

# What the Edimax and the ATS2851 lacked (.agents/context/linux-peer.md, "The adapter").
# 251-byte LE buffers and data length, so the kernel offers an LE CoC MPS of 247. The sample's 27 gives 23,
# which stalls an iPhone's writes.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_RX_BUFFERS=10
# Room for the six links a busy peer holds, and two more.
CONFIG_BT_MAX_CONN=8
# Advertising sets of its own, so the peer advertises while it holds links in either role.
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_SET=4
# Extended advertising's commands and reports outgrow the sample's 65- and 68-byte buffers.
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
# The nRF52840's most, +8 dBm: the dongle's printed antenna is small, and the phones sit metres away.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
