# Merged over .swiftlint.yml by `scripts/check.sh analyze` on Linux only.
#
# On Linux, Foundation's types (FileManager, URL, Data, JSONSerialization) are declared in FoundationEssentials,
# so SourceKit attributes them to that module and `unused_import` reports every needed `import Foundation` as
# unused. Removing one breaks the build. The Mac runner analyzes with .swiftlint.yml alone, where Foundation is
# one module, so a Foundation import that really is unused is still caught there.
unused_import:
  always_keep_imports:
    - Foundation

# Three targets are analyzed on the Mac only. Knit and KnitBLE compile to empty modules here, and SourceKit reports
# their Apple-only code as errors. SourceKit crashes (SIGSEGV) expanding `@Observable` under `swiftlint analyze` on
# Linux with Swift 6.4 and SwiftLint 0.65.1, in-process plugin or not, so KnitAppCore, whose view models use it,
# goes too; drop it once a toolchain passes. `check.sh analyze` hands SwiftLint each module's files, which it takes
# as given, and gives no run to a module whose `../Sources/` line is below. The parent's exclusions are repeated
# because a child's list replaces them, and every path is relative to this file.
excluded:
  - ../.build
  - ../Fuzz/.build
  - ../Sources/Knit
  - ../Sources/KnitBLE
  - ../Sources/KnitAppCore
